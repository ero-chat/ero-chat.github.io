<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Address Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Генератор адресов Bitcoin (secp256k1)</h2>
        
        <div class="controls">
            <div class="input-group">
                <label for="page-input">Текущая страница:</label>
                <input type="text" id="page-input" value="1">
            </div>
            
            <div class="buttons">
                <button onclick="goToFirstPage()" title="В самое начало">⏮ В начало</button>
                <button onclick="goToLastPage()" title="В самый конец">В конец ⏭</button>
                <button onclick="changePage(-1)">◀ Назад</button>
                <button onclick="changePage(1)">Вперед ▶</button>
                <button onclick="goRandomPage()" class="btn-random">🎲 Случайная</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 4%;">#</th>
                        <th style="width: 26%;">Сжатый Публичный Ключ (Hex)</th>
                        <th style="width: 26%;">Несжатый Публичный Ключ (Hex)</th>
                        <th style="width: 15%;">Сжатый Адрес</th>
                        <th style="width: 15%;">Несжатый Адрес</th>
                        <th style="width: 14%;">WIF Compressed</th>
                    </tr>
                </thead>
                <tbody id="keys-table-body">
                    <!-- Строки генерируются через JS -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
