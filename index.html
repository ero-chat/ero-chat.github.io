<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эро чат (18+)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e2e8f0;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #161920;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #232836;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .age-badge {
            display: inline-block;
            background: #ff2a74;
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .section {
            margin-bottom: 35px;
        }

        h2 {
            color: #ff2a74;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 2px solid #232836;
            padding-bottom: 5px;
        }

        p {
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        .features-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .features-list li {
            position: relative;
            padding-left: 30px;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        .features-list li::before {
            content: "✦";
            position: absolute;
            left: 0;
            top: 0;
            color: #ff2a74;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .cta-container {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #232836;
        }

        /* Кнопка скачивания в стиле 18+ */
        .download-btn {
            background: linear-gradient(135deg, #2dbd5f 100%, #ff5252 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 42, 116, 0.4);
            letter-spacing: 0.5px;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #e01b5f 0%, #e64545 100%);
            box-shadow: 0 6px 25px rgba(255, 42, 116, 0.6);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .btn-link {
            text-decoration: none;
        }

        .warning-text {
            color: #ff5252;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: center;">
            <span class="age-badge">18+ ТОЛЬКО ДЛЯ ВЗРОСЛЫХ</span>
        </div>
        
        <h1>Приватный эро видео чат. Порно, видео, общение.</h1>
        <h1>Private erotic video chat. Porn, video, communication.</h1>>

        <!-- Контейнер со стилизованной кнопкой скачивания -->
        <div class="cta-container">
            <a href="app-release.apk" download="Ero_Chat.apk" class="btn-link">
                <button type="button" class="download-btn">
                    Скачать приложение (18+)
                </button>
            </a>
            <p class="warning-text">Вход строго с 18 лет. Скачивая файл, вы подтверждаете свой возраст.</p>
        </div>
    </div>

</body>
</html>
